name: sync-packages

# The Software section of JohnEhrlinger-CV.qmd is generated from hvtiR's
# published manifest. This job proposes an update when that manifest changes.
#
# Verification on push and pull request lives in build-cv.yml, which already
# gates this repo; duplicating it here would run the same check twice per PR.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Test the Software-section renderer
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      # render_packages.py fails loudly on a manifest fetch error, so a network
      # blip cannot publish a shortened section. A crandb lookup failure only
      # drops the version number, which is why it warns instead of failing.
      - name: Render the Software section from the manifest
        run: python3 tools/render_packages.py

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-packages
          delete-branch: true
          title: "chore: sync the Software section with hvtiR's manifest"
          commit-message: |
            chore: sync the Software section with hvtiR's manifest

            Generated by tools/render_packages.py from
            https://ehrlinger.github.io/hvtiR/members.json. Edit
            inst/extdata/catalog.csv in ehrlinger/hvtiR rather than this file:
            anything between the BEGIN:packages markers is overwritten.
          body: |
            The Software section of `JohnEhrlinger-CV.qmd` no longer matches
            hvtiR's published manifest, so this PR regenerates it.

            The source of truth is `inst/extdata/catalog.csv` in
            [ehrlinger/hvtiR](https://github.com/ehrlinger/hvtiR); this section
            is a rendering of it. To change wording, change the catalog.

            CRAN version numbers come from crandb at render time, so a new CRAN
            release will show up here on the next scheduled run.
